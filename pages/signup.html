<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | GameVerse</title>

    <link rel="stylesheet" href="../styles/pages/singup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <main class="auth-page">
      <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
      </a>

      <section class="auth-container">
        <a href="index.html" class="logo">
          <i class="fa-solid fa-gamepad"></i>
          GAME<span>VERSE</span>
        </a>

        <div class="auth-heading">
          <span class="auth-label">JOIN THE COMMUNITY</span>
          <h1>Create Account</h1>
          <p>Discover new games and start your gaming journey.</p>
        </div>

        <form class="auth-form">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user"></i>
              <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope"></i>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="8"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-shield-halved"></i>
              <input
                type="password"
                id="confirm-password"
                placeholder="Repeat your password"
                minlength="8"
                required
              />
            </div>
          </div>

          <label class="terms-option">
            <input type="checkbox" required />
            <span>
              I agree to the
              <a href="#">Terms of Service</a>
              and
              <a href="#">Privacy Policy</a>.
            </span>
          </label>

          <button type="submit" class="auth-button">
            Create Account
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider">
          <span>OR</span>
        </div>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Log In</a>
        </p>

        <p class="auth-footer">© 2026 GameVerse. All rights reserved.</p>
      </section>
    </main>
  </body>
</html>
